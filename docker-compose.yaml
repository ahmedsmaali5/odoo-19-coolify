services:
  db:
    image: 'postgres:17'
    container_name: odoo19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    volumes:
      - './postgresql:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U odoo'
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build: .
    container_name: odoo19
    user: root
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '8069:8069'
      - '8072:8072'
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_password
      ADDONS: ""
    volumes:
      - 'odoo-web-data:/var/lib/odoo'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ADDONS=$(find /mnt/extra-addons -maxdepth 1 -mindepth 1 -type d \
          -exec test -f '{}/__manifest__.py' \; -print \
          | xargs -I{} basename {} \
          | paste -sd ',' -)
        if [ -n "$ADDONS" ]; then
          echo "[startup] Installing/updating: $ADDONS"
          exec /entrypoint.sh odoo --init="$ADDONS" --update="$ADDONS"
        else
          echo "[startup] No custom addons found."
          exec /entrypoint.sh odoo
        fi

volumes:
  odoo-web-data: null
