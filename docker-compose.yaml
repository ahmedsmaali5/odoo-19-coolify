services:
  db:
    image: 'postgres:17'
    container_name: odoo19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    volumes:
      - './postgresql:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U odoo'
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: 'odoo:19'
    container_name: odoo19
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - '8069:8069'
      - '8072:8072'
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo_password
    volumes:
      - 'odoo-web-data:/var/lib/odoo'
      - 'odoo-extra-addons:/mnt/extra-addons'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[startup] Fetching latest custom addons from GitHub..."
        apt-get install -q -y git 2>/dev/null
        rm -rf /tmp/repo
        git clone --depth=1 https://github.com/ahmedsmaali5/odoo-19-coolify.git /tmp/repo
        rm -rf /mnt/extra-addons/*
        cp -r /tmp/repo/custom_addons/. /mnt/extra-addons/

        cat > /etc/odoo/odoo.conf <<EOF
        [options]
        admin_passwd = admin_master_password
        db_host = db
        db_port = 5432
        db_user = odoo
        db_password = odoo_password
        addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
        proxy_mode = True
        workers = 2
        max_cron_threads = 1
        EOF

        ADDONS=$(find /mnt/extra-addons -maxdepth 1 -mindepth 1 -type d \
          -exec test -f '{}/__manifest__.py' \; -print \
          | xargs -I{} basename {} \
          | paste -sd ',' -)

        if [ -n "$ADDONS" ]; then
          echo "[startup] Installing/updating addons: $ADDONS"
          exec /entrypoint.sh odoo --init="$ADDONS" --update="$ADDONS"
        else
          echo "[startup] No custom addons found, starting normally."
          exec /entrypoint.sh odoo
        fi

volumes:
  odoo-web-data: null
  odoo-extra-addons: null
